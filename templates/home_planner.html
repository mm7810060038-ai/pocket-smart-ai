{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block content %}
<div class="form-card wide"><h1>🏠 Home Interior Planner</h1><p>Enter your budget and preferences.</p><form data-api-form action="/generate-home" method="post"><label>Budget (₹)<input type="number" name="budget" min="1" step="0.01" required></label><label>Room<input name="room" placeholder="Living Room" required></label><label>Style<select name="style"><option>Modern</option><option>Minimal</option><option>Traditional</option><option>Contemporary</option></select></label><label>Items needed<input name="items" value="Lights, fan, table"></label><button class="btn" type="submit">Generate Recommendations</button></form><div id="result"></div></div>
{% endblock %}
