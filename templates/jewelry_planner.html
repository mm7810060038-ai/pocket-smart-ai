{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}
<div class="form-card wide"><h1>💎 Jewelry Budget Planner</h1><p>Use text preferences and optionally upload an outfit image.</p><form data-api-form action="/generate-jewelry" method="post" enctype="multipart/form-data"><label>Budget (₹)<input type="number" name="budget" min="1" step="0.01" required></label><label>Occasion<input name="occasion" placeholder="Wedding / Party" required></label><label>Style<select name="style"><option>Elegant</option><option>Minimal</option><option>Traditional</option><option>Statement</option></select></label><label>Outfit notes<input name="outfit" placeholder="Optional color/style notes"></label><label>Outfit image (optional)<input type="file" name="outfit_image" accept=".jpg,.jpeg,.png,.webp"></label><button class="btn" type="submit">Generate Suggestions</button></form><div id="result"></div></div>
{% endblock %}
