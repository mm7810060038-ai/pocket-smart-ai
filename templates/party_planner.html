{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}
<div class="form-card wide"><h1>🎉 Party Budget Planner</h1><p>Plan food, venue and decoration.</p><form data-api-form action="/generate-party" method="post"><label>Budget (₹)<input type="number" name="budget" min="1" step="0.01" required></label><label>Guests<input type="number" name="guests" min="1" required></label><label>Event type<input name="event_type" placeholder="Birthday" required></label><label>Venue / Location<input name="venue" value="Chennai"></label><button class="btn" type="submit">Generate Plan</button></form><div id="result"></div></div>
{% endblock %}
